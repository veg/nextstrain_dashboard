name: Daily Surveillance Pipeline

on:
  schedule:
    - cron: '0 4 * * *' # Run daily at 04:00 UTC
  workflow_dispatch:
    inputs:
      pathogen:
        description: 'Specific pathogen to run (or all)'
        required: false
        default: 'all'

jobs:
  surveillance-sync:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install zstandard jinja2 biopython scipy numpy torch

      - name: Install ChronAeon and HyphAeon
        run: |
          pip install chronaeon hyphaeon || echo "Engines installed or local"

      - name: Crawl Nextstrain Dynamic Registry
        run: python pipeline/sync_registry.py

      - name: Ingest and Deconvolve Tier-1 Pathogens
        run: |
          # Sync and deconvolve SARS-CoV-2
          python pipeline/sync_pathogen.py --pathogen sars-cov-2
          python pipeline/run_chronaeon.py --pathogen sars-cov-2 -a data/sars-cov-2/spike_alignment.fasta -d data/sars-cov-2/collapsed_metadata.tsv -o data/sars-cov-2
          python pipeline/run_hyphaeon.py --pathogen sars-cov-2 -a data/sars-cov-2/spike_alignment.fasta -d data/sars-cov-2/chronaeon_work/classified.csv -o data/sars-cov-2
          python pipeline/compute_delta.py --pathogen sars-cov-2

          # Sync and deconvolve Avian Flu H5N1
          python pipeline/sync_pathogen.py --pathogen avian-flu-h5n1
          python pipeline/run_chronaeon.py --pathogen avian-flu-h5n1 -a data/avian-flu-h5n1/collapsed_alignment.fasta -d data/avian-flu-h5n1/collapsed_metadata.tsv -o data/avian-flu-h5n1
          python pipeline/run_hyphaeon.py --pathogen avian-flu-h5n1 -a data/avian-flu-h5n1/collapsed_alignment.fasta -d data/avian-flu-h5n1/chronaeon_work/classified.csv -o data/avian-flu-h5n1
          python pipeline/compute_delta.py --pathogen avian-flu-h5n1

      - name: Commit Updated Surveillance Data
        run: |
          git config --global user.name "Pathogen Intelligence Bot"
          git config --global user.email "bot@veg.org"
          git add static/data/ state/
          git diff --quiet && git diff --staged --quiet || git commit -m "chore(surveillance): daily data sync & analytical update [skip ci]"
          git push origin main || echo "No changes to push"
